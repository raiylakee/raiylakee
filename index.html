        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f1115;
            color: #c8cdd3;
            min-height: 100vh;
        }

        a { color: #5b9cf6; text-decoration: none; transition: color 0.2s; }
        a:hover { color: #8bb8fa; }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 80px 40px;
        }

        .hero {
            display: flex;
            gap: 60px;
            align-items: flex-start;
        }

        .left {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            padding-top: 20px;
            min-width: 280px;
        }

        .left .name {
            font-size: 2rem;
            font-weight: 600;
            color: #eaf0f7;
            margin-bottom: 8px;
        }

        .left .subtitle {
            font-size: 0.95rem;
            color: #8a92a0;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .left .socials {
            display: flex;
            gap: 14px;
            margin-bottom: 32px;
        }

        .left .socials svg {
            width: 20px;
            height: 20px;
            fill: #5b9cf6;
            transition: fill 0.2s;
        }

        .left .socials a:hover svg { fill: #8bb8fa; }

        .left nav {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
        }

        .left nav a {
            font-size: 1.05rem;
            font-weight: 500;
        }

        .right {
            flex: 1;
        }

        .right {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .right img {
            width: 100%;
            max-width: 440px;
            border-radius: 6px;
            object-fit: cover;
            border: 2px solid #1e2330;
            max-height: 500px;
            object-position: center top;
        }

        @media (max-width: 768px) {
            .hero {
                flex-direction: column;
                gap: 30px;
            }

            .left {
                align-items: center;
                text-align: center;
                min-width: auto;
            }

            .left .socials {
                justify-content: center;
            }

            .left nav {
                align-items: center;
            }

            .right {
                display: flex;
                justify-content: center;
            }

            .right img {
                max-width: 300px;
                width: 100%;
                max-height: 350px;
            }

            .container {
                padding: 60px 20px;
            }
        }

        @media (max-width: 480px) {
            .right img {
                max-width: 250px;
                max-height: 280px;
            }

            .left .name {
                font-size: 1.75rem;
            }

            .left .subtitle {
                font-size: 0.9rem;
            }

            .container {
                padding: 40px 15px;
            }
        }

        .blogs {
            margin-top: 60px;
            padding-top: 40px;
        }

        .blog-entry {
            padding: 10px 0;
            border-bottom: 1px solid #161a20;
            display: flex;
            align-items: center;
        }

        .blog-entry .arrow {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            margin-right: 8px;
        }
        .blog-entry .title { color: #c8cdd3; font-size: 0.95rem; }
        .blog-entry .title:hover { color: #8bb8fa; }
        .blog-entry .date { color: #3d6ea8; font-size: 0.85rem; margin-left: 8px; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
